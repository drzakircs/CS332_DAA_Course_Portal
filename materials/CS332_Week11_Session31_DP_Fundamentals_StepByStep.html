<script>
'use strict';
const slides=[];
function add(time,title,sub,content,notes){slides.push({time,title,sub,content,notes});}
const chk=(id,txt,cls='teal-text')=>` <button class="mini-btn" data-act="reveal" data-id="${id}">Answer</button> <b id="${id}" hidden class="${cls}">${txt}</b>`;

/* ---------- step-by-step guides ---------- */
const GUIDES={
 subs:{title:'Optimal substructure in 5 steps',steps:[
  ['Recall','DP fits when a problem has <b>two</b> properties. This slide covers the first: <b>optimal substructure</b>.'],
  ['In plain words','The best answer to a big problem is <b>built from the best answers</b> to smaller problems.'],
  ['See it on the left','To pay 6 with coins {1, 3, 4}, the <b>last coin</b> is 1, 3 or 4. Whatever it is, the rest must be paid <b>optimally</b> too. Click through each choice.'],
  ['Write it as a formula','best(a) = 1 + min( best(a−1), best(a−3), best(a−4) )<br>best(0) = 0'],
  ['Check yourself','Greedy also needs optimal substructure. What does DP do differently?'+chk('gs5','DP tries <b>every</b> last choice and keeps the best; greedy commits to one.')]]},
 overlap:{title:'Overlapping subproblems in 5 steps',steps:[
  ['Property 2','<b>Overlapping subproblems</b>: the same smaller question is asked again and again.'],
  ['Watch it','Click <b>Next call</b>. The counter shows how often each F(k) is computed. Pink = wasted, repeated work.'],
  ['Why it hurts','Plain recursion makes about 1.6ⁿ calls. F(40) ≈ <b>331 million</b> calls for only <b>41</b> different subproblems.'],
  ['The DP fix','Store each answer the first time; reuse it after that. The work drops to <b>O(n)</b>.'],
  ['Check yourself','While computing F(5), how many times is F(2) computed?'+chk('go5','3 times (and F(3) twice).')]]},
 recur:{title:'Recurrence recipe in 5 steps',steps:[
  ['Why a recurrence?','It is the <b>heart of every DP</b>: it says how a big answer is made from smaller ones.'],
  ['① State','Say in words what the function means: "ways(n) = number of ways to reach step n."'],
  ['② Last choice','Ask: what was the <b>last decision</b>? Each possible last decision leads to one smaller subproblem.'],
  ['③ Combine · ④ Base cases','Combine the choices (<b>+</b> to count, <b>min/max</b> to optimise). Stop the recursion with base cases.'],
  ['Check yourself','If you may also take 3-steps, what is the new recurrence?'+chk('gr5','ways(n) = ways(n−1) + ways(n−2) + ways(n−3), with ways(0) = 1 and ways(n) = 0 for n &lt; 0.')]]},
 memo:{title:'Memoization vs tabulation in 5 steps',steps:[
  ['Same recurrence, two orders','You can store answers <b>top-down</b> (memoization) or <b>bottom-up</b> (tabulation).'],
  ['Memoization','Keep the recursion. Before computing, <b>look in the memo</b>; after computing, <b>save</b> the answer. Only needed subproblems get solved.'],
  ['Tabulation','No recursion. Fill a table from the <b>base cases upward</b> with a loop, so every lookup is already filled.'],
  ['Compare','Both take O(n) here. Memo is quick to write from the recurrence. A table avoids deep recursion and makes saving memory easy.'],
  ['Check yourself','For n = 1,000,000, which one risks a stack overflow?'+chk('gm5','Memoization, because the recursion goes 1,000,000 calls deep. Tabulation is just a loop.','pink-text')]]},
 flow:{title:'The DP workflow in 6 steps',steps:[
  ['Use it every time','Five moves for every DP in this course (knapsack, rod cutting, LCS).'],
  ['① Define the subproblem','What does <b>one table cell</b> mean? T[a] = fewest coins to pay a.'],
  ['② Recurrence · ③ Base cases','How a cell is built from <b>smaller</b> cells, and which cells are known without any work.'],
  ['④ Evaluation order','Fill cells so that everything a cell needs is <b>already filled</b>: usually small → large.'],
  ['⑤ Answer + cost','Read the answer cell, and trace back the choices if needed. Time = <b>#cells × work per cell</b>.'],
  ['Check yourself','Coins {1, 3, 4}, amount A. What is the running time?'+chk('gf6','A + 1 cells × 3 choices = <b>O(A)</b>.')]]},
 act:{title:'How to fill a DP table',steps:[
  ['Your task','Turn the recurrence into a table by filling cells <b>in order</b>. Choose exercise A or B.'],
  ['Find the inputs','The <span class="teal-text"><b>teal</b></span> cells are the ones the <span class="amber-text"><b>amber</b></span> cell depends on.'],
  ['Compute & type','Apply the formula, type the value, press <b>Enter</b>. Stuck? <b>Show me</b> explains it.'],
  ['Read the answer','The last cell is the final answer. In A, the coins are traced back for you.'],
  ['Check yourself','In B, why can we fill row by row, left to right?'+chk('ga5','Each cell needs only the cell <b>above</b> and the cell to the <b>left</b>, and both are already filled.')]]}
};
const gStep={};
function guideHtml(k){const g=GUIDES[k],s=gStep[k]||1,n=g.steps.length;
 return `<div class="guide-head"><h3>${g.title}</h3><div class="pips">${g.steps.map((_,i)=>`<i class="${i<s?'on':''}"></i>`).join('')}</div></div>
 <div style="flex:1;min-height:0">${g.steps.slice(0,s).map(([t,b],i)=>`<div class="gcard ${i===s-1?'new':''} ${t.startsWith('Check')?'check':''}"><span class="num">${i+1}</span><div><b class="t">${t}</b>${b}</div></div>`).join('')}</div>
 <div class="controls" style="margin-top:8px"><button class="small-btn" data-act="g-prev" data-g="${k}" ${s<=1?'disabled':''}>← Back</button>${s<n?`<button class="small-btn amber" data-act="g-next" data-g="${k}">Next step (${s+1}/${n}) →</button>`:`<button class="small-btn primary" data-act="next">✓ Done: next slide →</button>`}</div>`;}
function mountGuides(){document.querySelectorAll('[data-guide]').forEach(el=>el.innerHTML=guideHtml(el.dataset.guide));}

/* ---------- slides ---------- */
add('00–04 min','Dynamic programming: solve once, remember','Session 31 · How to use this lesson, and where we are going.',`
<div class="grid two fill">
 <div class="panel purple col" style="justify-content:center;gap:16px;background:linear-gradient(140deg,#2e2650,#151c37)">
  <span class="tag purple">Week 11 · Session 31</span>

  <div class="callout purple" style="font-size:17px">Last session, greedy failed for coins {1, 3, 4}: it paid 6 with 4+1+1 instead of 3+3. Today we learn the method that is <b>always</b> right: dynamic programming.</div>
  <div class="grid three">
   <div class="howto"><div class="icon">📖</div><b>1 · Read</b><span class="subtle">one step at a time</span></div>
   <div class="howto"><div class="icon">🤔</div><b>2 · Predict</b><span class="subtle">before you click</span></div>
   <div class="howto"><div class="icon">👆</div><b>3 · Click</b><span class="subtle">and check yourself</span></div>
  </div>
 </div>
 <div class="panel col">
  <h3>Today's path (click to jump)</h3>
  <button class="jump" data-act="jump" data-target="1"><span>🧱</span>Optimal substructure: building from the best parts</button>
  <button class="jump" data-act="jump" data-target="2"><span>🔁</span>Overlapping subproblems: the same work again</button>
  <button class="jump" data-act="jump" data-target="3"><span>✍</span>Recurrence formulation: write the rule</button>
  <button class="jump" data-act="jump" data-target="4"><span>⚖</span>Memoization vs tabulation</button>
  <button class="jump" data-act="jump" data-target="5"><span>🔄</span>DP workflow: recursion → table</button>

 <div class="codebox" style="min-height:150px">${TAB.slice(0,convStep).map(([l,c],i)=>`<span class="ln ${i===convStep-1?'new':''}">${l.padEnd?l:l}   <span class="cm">// ${c}</span></span>`).join('')||'<span class="cm">// builds here, one line per move</span>'}</div>
 <div class="feedback ${convStep===5?'ok':''}" style="margin-top:auto">${CONVMSG[convStep]}</div>
 <div class="controls" style="margin-top:8px"><button class="small-btn" data-act="cv-prev" ${convStep?'':'disabled'}>← Back</button><button class="small-btn purple" data-act="cv-next" ${convStep===5?'disabled':''}>Next move →</button><button class="small-btn" data-act="cv-reset">↺ Reset</button></div>`;}

/* Slide 7: activity */
let actMode='A';const ACTA={A:10};const A_T=coinTable(10).T;
const actA={i:1,fb:'',cls:''};
const GR=4,GC=5;const gridVal=(r,c)=>{const g=[];for(let i=0;i<GR;i++){g.push([]);for(let j=0;j<GC;j++)g[i].push(i===0||j===0?1:g[i-1][j]+g[i][j-1]);}return g[r][c];};
const INTERIOR=[];for(let r=1;r<GR;r++)for(let c=1;c<GC;c++)INTERIOR.push([r,c]);
const actB={k:0,fb:'',cls:''};
function mountAct(){const el=$('#actLab');if(!el)return;
 const tabs=`<div class="tabs"><button class="tab ${actMode==='A'?'on':''}" data-act="act-mode" data-m="A">A · 1-D: fewest coins</button><button class="tab ${actMode==='B'?'on':''}" data-act="act-mode" data-m="B">B · 2-D: grid paths</button></div>`;
 if(actMode==='A'){const i=actA.i,done=i>10,deps=done?[]:COINS.filter(c=>c<=i).map(c=>i-c);
  el.innerHTML=`${tabs}<div class="recline" style="margin:10px 0 8px">T[a] = 1 + min( T[a−1], T[a−3], T[a−4] ) &nbsp;<span class="subtle" style="font-family:inherit;font-size:15px">(only terms with a−c ≥ 0) · T[0] = 0</span></div>
  <div class="cells">${A_T.map((v,a)=>`<div class="cell ${a===0?'base':a<i?'done':a===i?'cur':'empty'} ${deps.includes(a)?'dep':''}"><div class="v">${a<i?v:a===i?'?':'·'}</div><small>T[${a}]</small></div>`).join('')}</div>
  ${done?`<div class="feedback ok" style="margin-top:14px"><b>Table complete! T[10] = 3 coins.</b> Trace back: 10 → (−3) 7 → (−3) 4 → (−4) 0, so <b>3 + 3 + 4</b>. Greedy would give 4 + 4 + 1 + 1 = 4 coins.</div>`:
  `<div class="summary-row" style="margin:14px 0 8px"><span>Inputs: ${deps.map(d=>`T[${d}] = <b>${A_T[d]}</b>`).join(' · ')}</span></div>
  <div class="controls"><span class="lead" style="font-size:22px!important">T[${i}] =</span><input class="ans" id="ansA" inputmode="numeric" aria-label="Value of T[${i}]" autocomplete="off"><button class="small-btn purple" data-act="actA-check">Check ✓</button><button class="small-btn warning" data-act="actA-show">Show me</button></div>
  <div class="feedback ${actA.cls}" style="margin-top:10px">${actA.fb||`Compute 1 + min( ${deps.map(d=>'T['+d+']').join(', ')} ).`}</div>`}
  <div class="controls" style="margin-top:auto"><button class="small-btn" data-act="actA-reset">↺ Restart A</button><span class="status">Filled ${Math.min(i-1,10)} / 10</span></div>`;
  $('#ansA')?.focus();}
 else{const k=actB.k,done=k>=INTERIOR.length,[cr,cc]=done?[-1,-1]:INTERIOR[k];const filled=(r,c)=>r===0||c===0||INTERIOR.findIndex(([a,b])=>a===r&&b===c)<k;
  let tbl=`<table class="gridtab"><tr><th></th>${Array.from({length:GC},(_,c)=>`<th>c${c}</th>`).join('')}</tr>`;
  for(let r=0;r<GR;r++){tbl+=`<tr><th>r${r}</th>`;for(let c=0;c<GC;c++){const isCur=r===cr&&c===cc,isDep=(r===cr-1&&c===cc)||(r===cr&&c===cc-1);tbl+=`<td class="${r===0||c===0?'base':isCur?'cur':filled(r,c)?'done':'empty'} ${isDep?'dep':''}">${filled(r,c)?gridVal(r,c):isCur?'?':'·'}</td>`;}tbl+='</tr>';}tbl+='</table>';
  el.innerHTML=`${tabs}<p class="status" style="margin:8px 0 4px">🤖 A robot starts at the top-left and moves only <b>right</b> or <b>down</b>. How many paths reach each cell?</p><div class="recline" style="margin:0 0 8px">P[r][c] = P[r−1][c] + P[r][c−1] &nbsp;<span class="subtle" style="font-family:inherit;font-size:15px">· row 0 and column 0 = 1</span></div>
  ${tbl}
  ${done?`<div class="feedback ok" style="margin-top:12px"><b>Table complete! P[3][4] = 35 paths.</b> Same shape as the knapsack and LCS tables coming next.</div>`:
  `<div class="controls" style="margin-top:12px"><span class="lead" style="font-size:22px!important">P[${cr}][${cc}] =</span><input class="ans" id="ansB" inputmode="numeric" aria-label="Value of P[${cr}][${cc}]" autocomplete="off"><button class="small-btn purple" data-act="actB-check">Check ✓</button><button class="small-btn warning" data-act="actB-show">Show me</button></div>
  <div class="feedback ${actB.cls}" style="margin-top:8px">${actB.fb||`Above (P[${cr-1}][${cc}] = ${gridVal(cr-1,cc)}) + left (P[${cr}][${cc-1}] = ${gridVal(cr,cc-1)}).`}</div>`}
  <div class="controls" style="margin-top:auto"><button class="small-btn" data-act="actB-reset">↺ Restart B</button><span class="status">Filled ${Math.min(k,12)} / 12</span></div>`;
  $('#ansB')?.focus();}}
function checkA(show){const i=actA.i,deps=COINS.filter(c=>c<=i).map(c=>i-c),want=A_T[i],expl=`1 + min(${deps.map(d=>A_T[d]).join(', ')}) = ${want}`;
 if(show){actA.fb=`T[${i}] = ${expl}. Filled for you.`;actA.cls='hint';actA.i++;return mountAct();}
 const v=parseInt(($('#ansA')||{}).value,10);if(v===want){actA.fb=`✓ Correct: T[${i}] = ${expl}.`;actA.cls='ok';actA.i++;}else{actA.fb=`✗ Not ${isNaN(v)?'empty':v}. Take the smallest input (${Math.min(...deps.map(d=>A_T[d]))}) and add 1.`;actA.cls='no';}mountAct();}
function checkB(show){const [r,c]=INTERIOR[actB.k],want=gridVal(r,c),expl=`${gridVal(r-1,c)} + ${gridVal(r,c-1)} = ${want}`;
 if(show){actB.fb=`P[${r}][${c}] = ${expl}. Filled for you.`;actB.cls='hint';actB.k++;return mountAct();}
 const v=parseInt(($('#ansB')||{}).value,10);if(v===want){actB.fb=`✓ Correct: ${expl}.`;actB.cls='ok';actB.k++;}else{actB.fb=`✗ Not ${isNaN(v)?'empty':v}. Add the teal cell above and the teal cell to the left.`;actB.cls='no';}mountAct();}

/* ---------- deck control ---------- */
function mountAll(){mountGuides();mountSubs();mountOver();mountRec();mountMemo();mountConv();mountAct();}
function fitDeck(){const r=Math.min(innerWidth/1600,innerHeight/900),d=$('#deck');d.style.position='absolute';d.style.left='50%';d.style.top='50%';d.style.transform=`translate(-50%,-50%) scale(${r})`;}
function closeOverlays(){const o=$('#notesOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');}
function openNotes(){const s=slides[current];$('#notesPosition').textContent=`Slide ${current+1} · ${s.time}`;$('#notesContent').textContent=s.notes;$('#notesOverlay').classList.add('open');$('#notesOverlay').setAttribute('aria-hidden','false');}
function goTo(i){current=Math.max(0,Math.min(slides.length-1,i));seen.add(current);closeOverlays();render();}
function render(){const s=slides[current];
 $('#slide').innerHTML=`<div class="kicker"><span class="dot"></span> SESSION 31 · DYNAMIC PROGRAMMING FUNDAMENTALS &nbsp;·&nbsp; <span class="time">⏱ ${s.time}</span></div><h1 class="slide-title">${s.title}</h1><div class="slide-sub">${s.sub}</div><div class="slide-body">${s.content}</div>`;
 $('#dots').innerHTML=slides.map((x,i)=>`<button class="${i===current?'on':seen.has(i)?'seen':''}" data-act="jump" data-target="${i}" title="${esc(x.title)}">${i+1}</button>`).join('');
 $('#pageCount').textContent=(current+1)+' / '+slides.length;$('#progressFill').style.width=((current+1)*100/slides.length)+'%';
 $('#prevButton').disabled=current===0;$('#nextButton').disabled=current===slides.length-1;mountAll();}
let cs=null,ca=0,ct=null;const ctext=()=>{const s=Math.floor((ca+(cs?Date.now()-cs:0))/1000);return '⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function toggleClock(){const b=$('#timerBtn');if(cs){ca+=Date.now()-cs;cs=null;clearInterval(ct);b.classList.remove('running');}else{cs=Date.now();ct=setInterval(()=>b.textContent=ctext(),1000);b.classList.add('running');}b.textContent=ctext();}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='prev')return goTo(current-1);if(a==='next')return goTo(current+1);if(a==='jump')return goTo(+b.dataset.target);
 if(a==='timer')return toggleClock();if(a==='close')return closeOverlays();if(a==='notes')return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();
 if(a==='full'){if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();return;}
 if(a==='reveal'){const n=document.getElementById(b.dataset.id);if(n)n.hidden=!n.hidden;return;}
 if(a==='g-next'||a==='g-prev'){const k=b.dataset.g,n=GUIDES[k].steps.length;gStep[k]=Math.max(1,Math.min(n,(gStep[k]||1)+(a==='g-next'?1:-1)));return mountGuides();}
 if(a==='sub-next'){subStep=Math.min(4,subStep+1);return mountSubs();}if(a==='sub-reset'){subStep=0;return mountSubs();}
 if(a==='ov-next'){ovStep=Math.min(15,ovStep+1);return mountOver();}if(a==='ov-all'){ovStep=15;return mountOver();}if(a==='ov-reset'){ovStep=0;return mountOver();}
 if(a==='rq'){const i=+b.dataset.i;if(i===RQ[rqStep].a){rqStep++;rqWrong=-1;}else rqWrong=i;return mountRec();}
 if(a==='rq-reset'){rqStep=0;rqWrong=-1;return mountRec();}
 if(a==='mv-mode'){mvMode=b.dataset.m;mvStep=0;return mountMemo();}
 if(a.startsWith('mv-')){const L=MV[mvMode].length;mvStep=a==='mv-reset'?0:a==='mv-all'?L:Math.max(0,Math.min(L,mvStep+(a==='mv-next'?1:-1)));return mountMemo();}
 if(a.startsWith('cv-')){convStep=a==='cv-reset'?0:Math.max(0,Math.min(5,convStep+(a==='cv-next'?1:-1)));return mountConv();}
 if(a==='act-mode'){actMode=b.dataset.m;return mountAct();}
 if(a==='actA-check')return checkA(false);if(a==='actA-show')return checkA(true);if(a==='actA-reset'){actA.i=1;actA.fb='';actA.cls='';return mountAct();}
 if(a==='actB-check')return checkB(false);if(a==='actB-show')return checkB(true);if(a==='actB-reset'){actB.k=0;actB.fb='';actB.cls='';return mountAct();}
});
document.addEventListener('keydown',ev=>{
 if(ev.ctrlKey&&ev.shiftKey&&ev.key.toLowerCase()==='p'){ev.preventDefault();return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();}
 if(ev.key==='Escape')return closeOverlays();const ae=document.activeElement;
 if(ae&&ae.classList.contains('ans')){if(ev.key==='Enter'){ev.preventDefault();ae.id==='ansA'?checkA(false):checkB(false);}return;}
 if(ae&&ae.type==='range'&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight'))return;
 if(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' '){ev.preventDefault();if(!$('.overlay.open'))goTo(current+1);return;}
 if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();if(!$('.overlay.open'))goTo(current-1);return;}
 if(ev.key.toLowerCase()==='f'){ev.preventDefault();if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();}
});
addEventListener('resize',fitDeck);document.addEventListener('fullscreenchange',fitDeck);fitDeck();render();
</script>
</body>
