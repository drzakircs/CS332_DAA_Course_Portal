<body>
<div id="deck" role="application" aria-label="Session 30 step-by-step lesson: the greedy method">
 <header class="topbar"><div class="brand">CS</div><div><div class="course">CS332 · SESSION 30</div><div class="course-sub">Air University · Week 10 · The greedy method · step-by-step lesson</div></div><div class="dots" id="dots"></div><button class="small-btn" id="timerBtn" data-act="timer" title="Start / pause the clock">⏱ 00:00</button><button class="small-btn" data-act="notes" title="Instructor notes (Ctrl+Shift+P)">☼ Notes</button><button class="small-btn" data-act="full" title="Full screen (F)">⛶</button></header>
 <main id="slide" aria-live="polite"></main>
 <footer class="footer"><div class="foot-hint">← → change slide &nbsp;·&nbsp; <b>Next step</b> buttons build each idea &nbsp;·&nbsp; Ctrl + Shift + P = tutor notes</div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="page-count" id="pageCount"></div><button class="nav-button" id="prevButton" data-act="prev">← Back</button><button class="nav-button next" id="nextButton" data-act="next">Next →</button></footer>
 <div id="notesOverlay" class="overlay" aria-hidden="true"><div class="overlay-panel"><div class="overlay-head"><h2>Instructor notes</h2><div style="margin-left:auto" class="status" id="notesPosition"></div><button class="small-btn" data-act="close">✕ Close</button></div><div id="notesContent" class="notes-content"></div></div></div>
</div>
<script>
'use strict';
const slides=[];
function add(time,title,sub,content,notes){slides.push({time,title,sub,content,notes});}
const chk=(id,txt,cls='teal-text')=>` <button class="mini-btn" data-act="reveal" data-id="${id}">Answer</button> <b id="${id}" hidden class="${cls}">${txt}</b>`;

/* ---------- step-by-step guides ---------- */
const GUIDES={
 change:{title:'Why greedy works here, in 5 steps',steps:[
  ['The greedy idea','A shopkeeper giving change hands over the <b>largest note that fits</b>, then repeats with what is left. Click <b>Give next note</b>.'],
  ['Property 1 · Greedy choice','Some best answer <b>starts with the greedy choice</b>. Giving the biggest note now never ruins the final answer.'],
  ['Property 2 · Optimal substructure','After one note, what is left (e.g. Rs 186) is a <b>smaller copy</b> of the same problem. Solve that best, and the whole answer is best.'],
  ['Both together','Greedy choice + optimal substructure ⇒ greedy is <b>optimal</b>. If either is missing, greedy may fail (slide 7).'],
  ['Check yourself','Is "largest note first" optimal for Rs 100, 50, 20, 10, 5, 2, 1?'+chk('gc5','Yes. The lab checks against an exact DP answer for every amount, and they always match.')]]},
 rules:{title:'Build a greedy solution in 5 steps',steps:[
  ['Step 1 · Objective','Maximise the <b>number</b> of non-overlapping activities in one room.'],
  ['Step 2 · Candidate rules','Three rules sound reasonable: earliest <b>start</b>, <b>shortest</b>, earliest <b>finish</b>. 🤔 Predict the winner, then try each tab.'],
  ['Step 3 · Test with examples','Earliest start → 1. Shortest → 3. Earliest finish → 4. A single counterexample <b>kills</b> a rule.'],
  ['Step 4 · Prove the survivor','Earliest finish leaves the most time for everything else. We prove it on slide 5.'],
  ['Check yourself','Why does "earliest start" fail here?'+chk('gr5','A starts first but runs 0–10 and blocks everything else.')]]},
 run:{title:'Run the algorithm in 5 steps',steps:[
  ['1 · Sort','Sort activities by <b>finish time</b>. (Already done on the left.)'],
  ['2 · Track one number','<b>lastFinish</b> = end time of the last activity you took. It starts at −∞.'],
  ['3 · Decide','If start ≥ lastFinish → <b>TAKE</b> and set lastFinish = finish. Otherwise → <b>SKIP</b>. Use the buttons on the left.'],
  ['4 · Cost','Sort O(n log n) + one scan O(n) = <b>O(n log n)</b> in total.'],
  ['Check yourself','lastFinish = 7 and the next activity is [5, 9). Take or skip?'+chk('gu5','Skip: 5 < 7, so it overlaps.','pink-text')]]},
 proof:{title:'Exchange argument in 4 steps',steps:[
  ['What is it?','Take <b>any</b> optimal solution and <b>swap</b> one of its choices for the greedy choice. Show it is still valid and just as good.'],
  ['Every exchange proof has 6 parts','<b>Set up → Greedy choice → Key fact → Swap → Conclude → Repeat.</b> Build the proof on the left in this order.'],
  ['Stuck?','Use <b>💡 Hint</b> on the left. A wrong piece shakes; there is no penalty, so try again.'],
  ['Check yourself','Try the same swap for "shortest first". Why does the proof break?'+chk('gp4','The shortest activity can finish <b>later</b> than X, so later activities may collide. The key fact finish(A) ≤ finish(X) is lost.')]]},
 fk:{title:'Fractional knapsack in 5 steps',steps:[
  ['The problem','A bag holds 50 kg. You may take <b>part</b> of an item (rice, gold dust, fuel). Maximise the value.'],
  ['Three rules','Highest value first? Lightest first? Best <b>value ÷ weight</b> first? 🤔 Predict, then try each tab.'],
  ['Why the ratio wins','Every kg of space should hold the most value. Swapping a low-ratio kg for a high-ratio kg only <b>raises</b> the value: another exchange argument.'],
  ['Cost','Compute ratios O(n), sort O(n log n), fill O(n). Total <b>O(n log n)</b>.'],
  ['Check yourself','At 50 kg, what does each rule give?'+chk('gf5','Highest value $220, lightest $230, ratio <b>$240</b>.')]]},
 limits:{title:'Strengths & limitations in 5 steps',steps:[
  ['Strengths','<b>Fast</b> (often O(n log n)), <b>simple</b> code, very little memory.'],
  ['Limitation 1 · Coins','Coins {1, 3, 4}, amount 6: greedy 4+1+1 = <b>3 coins</b>, best 3+3 = <b>2</b>. Try it on the left.'],
  ['Limitation 2 · 0/1 knapsack','No fractions, 50 kg: greedy by ratio takes A+B+D = <b>$170</b>; best is B+C = <b>$220</b>.'],
  ['The fix','When the greedy choice isn\'t provably safe, use <b>dynamic programming</b>: try every choice for each subproblem and store the best.'],
  ['Check yourself','Coins {1, 4, 6}, amount 8. Is greedy optimal?'+chk('gl5','No: greedy 6+1+1 = 3 coins; best 4+4 = 2.','pink-text')]]}
};
const gStep={};
function guideHtml(k){const g=GUIDES[k],s=gStep[k]||1,n=g.steps.length;
 return `<div class="guide-head"><h3>${g.title}</h3><div class="pips">${g.steps.map((_,i)=>`<i class="${i<s?'on':''}"></i>`).join('')}</div></div>
 <div style="flex:1;min-height:0">${g.steps.slice(0,s).map(([t,b],i)=>`<div class="gcard ${i===s-1?'new':''} ${t.startsWith('Check')?'check':''}"><span class="num">${i+1}</span><div><b class="t">${t}</b>${b}</div></div>`).join('')}</div>
 <div class="controls" style="margin-top:8px"><button class="small-btn" data-act="g-prev" data-g="${k}" ${s<=1?'disabled':''}>← Back</button>${s<n?`<button class="small-btn amber" data-act="g-next" data-g="${k}">Next step (${s+1}/${n}) →</button>`:`<button class="small-btn primary" data-act="next">✓ Done: next slide →</button>`}</div>`;}
function mountGuides(){document.querySelectorAll('[data-guide]').forEach(el=>el.innerHTML=guideHtml(el.dataset.guide));}

/* ---------- slides ---------- */
add('00–04 min','Greedy: choose, commit, repeat','Session 30 · How to use this lesson, and where we are going.',`
<div class="grid two fill">
 <div class="panel amber col" style="justify-content:center;gap:16px;background:linear-gradient(140deg,#3a2f1c,#151c37)">
  <span class="tag amber">Session 30 · The greedy method</span>
  <div class="fullsize">Best move now.<br><span class="amber-text">But is it safe?</span></div>
  <div class="callout amber" style="font-size:17px">Remember the S29 hiker? Same rule, but stuck on a small hill from one start and at the summit from another. Today: <b>when can we trust greedy, and how do we prove it?</b></div>
  <div class="grid three">
   <div class="howto"><div class="icon">📖</div><b>1 · Read</b><span class="subtle">one step at a time</span></div>
   <div class="howto"><div class="icon">🤔</div><b>2 · Predict</b><span class="subtle">before you click</span></div>
   <div class="howto"><div class="icon">👆</div><b>3 · Click</b><span class="subtle">and check yourself</span></div>
  </div>
 </div>
 <div class="panel col">
  <h3>Today's path (click to jump)</h3>
  <button class="jump" data-act="jump" data-target="1"><span>💵</span>Greedy-choice property: the shopkeeper</button>
  <button class="jump" data-act="jump" data-target="2"><span>📏</span>Constructing a greedy solution: which rule?</button>
  <button class="jump" data-act="jump" data-target="3"><span>▶</span>Run earliest-finish yourself</button>
  <button class="jump" data-act="jump" data-target="4"><span>🛡</span>Activity: greedy-choice justification</button>
  <button class="jump" data-act="jump" data-target="5"><span>🎒</span>Example: fractional knapsack</button>
  <button class="jump" data-act="jump" data-target="6"><span>⚠</span>Strengths &amp; limitations</button>
  <button class="jump" data-act="jump" data-target="7"><span>⚖</span>Greedy vs dynamic programming</button>
  <p class="mini" style="margin-top:auto">Look for the amber <b>Next step →</b> buttons on each slide.</p>
 </div>
</div>`,`Start the clock. Recap S29 in one sentence: greedy = best-looking move now, never undone.
ASK: "When the hiker got stuck, what went wrong?" A local best is not the global best. Today we learn to prove when greedy IS safe.`);

add('04–10 min','💵 What makes greedy correct?','Example: give change with the fewest notes and coins (Rs 100, 50, 20, 10, 5, 2, 1).',`
<div class="grid lab fill">
 <div class="panel amber col"><div id="changeLab" class="col" style="flex:1;min-height:0"></div></div>
 <div class="panel col" data-guide="change"></div>
</div>`,`Default Rs 286: 100, 100, 50, 20, 10, 5, 1 = 7 notes. DP agrees.
Point at the "remaining" chip after each note: that is optimal substructure made visible.
Key line: greedy choice + optimal substructure ⇒ greedy is optimal.`);

add('10–16 min','📏 Constructing a greedy solution','Activity selection: one room, seven requests. Which rule picks the most activities?',`
<div class="grid lab fill">
 <div class="panel amber col"><div id="ruleLab" class="col" style="flex:1;min-height:0"></div></div>
 <div class="panel col" data-guide="rules"></div>

const $=(q,r=document)=>r.querySelector(q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0;const seen=new Set([0]);
function dpCoins(d,amt){const best=Array(amt+1).fill(Infinity),pick=Array(amt+1).fill(0);best[0]=0;for(let a=1;a<=amt;a++)for(const c of d)if(c<=a&&best[a-c]+1<best[a]){best[a]=best[a-c]+1;pick[a]=c;}const ch=[];let a=amt;while(a>0&&pick[a]){ch.push(pick[a]);a-=pick[a];}return {count:best[amt],ch};}

/* Timeline */
function timelineSvg(tasks,dec=[],focus=-1,{width=820,height=300,max=14}={}){const padL=56,padR=20,plot=width-padL-padR,row=Math.min(36,(height-40)/tasks.length),top=32;
 let s=`<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:100%">`;
 for(let t=0;t<=max;t+=2){const x=padL+plot*t/max;s+=`<line x1="${x}" y1="26" x2="${x}" y2="${height-6}" stroke="#506784" stroke-dasharray="3 8" opacity=".6"/><text x="${x}" y="19" text-anchor="middle" fill="#a7c7df" font-size="15">${t}</text>`;}
 tasks.forEach((a,i)=>{const y=top+i*row,x=padL+plot*a.s/max,w=Math.max(5,plot*(a.e-a.s)/max),d=dec[i],fill=d==='take'?'#2ebf9d':d==='skip'?'#6b3d52':focus===i?'#e7b45a':'#315574',stroke=focus===i?'#ffeba6':d==='take'?'#73fbe0':'#769bb6';
  s+=`<text x="24" y="${y+row/2+6}" fill="#dfebf8" text-anchor="middle" font-size="18" font-weight="850">${a.id}</text><rect x="${x}" y="${y+3}" width="${w}" height="${row-8}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${x+w/2}" y="${y+row/2+5}" fill="${d==='skip'?'#f6c9da':'#fff'}" font-size="15" font-weight="750" text-anchor="middle">${a.s}–${a.e}</text>`;});
 return s+'</svg>';}

/* Proof builder */
const PROOF=[['Set up','Let O be any optimal schedule, and let X be its first activity.'],['Greedy choice','Let A be the activity that finishes earliest of all.'],['Key fact','So finish(A) ≤ finish(X).'],['Swap','Replace X with A in O. Every later activity started after X finished, so it also starts after A finishes.'],['Conclude','The new schedule is valid and the same size, so it is optimal and starts with A.'],['Repeat','Remove A and everything overlapping it. What is left is a smaller copy of the problem; apply the same argument.']];
const SHUF=[3,1,5,0,4,2];let proofDone=0,proofWrong=-1,proofHint=false;
function mountProof(){const el=$('#proofLab');if(!el)return;const left=SHUF.filter(k=>k>=proofDone);
 el.innerHTML=`<div class="summary-row"><span class="tag amber">Claim</span><span>"Earliest finish" is a safe greedy choice</span><span>Placed <b>${proofDone} / 6</b></span></div>
 <div style="margin-top:10px">${PROOF.slice(0,proofDone).map(([t,p],i)=>`<div class="proof-done"><span>${i+1}</span><div><b class="teal-text">${t}:</b> ${esc(p)}</div></div>`).join('')}</div>
 ${left.length?`<p class="mini" style="margin:6px 0">Pieces left: click the one that comes <b>next</b>:</p>${left.map(k=>`<button class="proof-step ${k===proofWrong?'wrong':''}" data-act="proof" data-k="${k}">${esc(PROOF[k][1])}</button>`).join('')}`:''}
 <div class="feedback ${proofDone===6?'ok':proofWrong>=0?'no':proofHint?'hint':''}" style="margin-top:auto">${proofDone===6?'<b>∎ Proof complete!</b> You built an <b>exchange argument</b>: swap an optimal choice for the greedy one and nothing gets worse.':proofHint?`💡 Next part is <b>${PROOF[proofDone][0]}</b>: it starts "${esc(PROOF[proofDone][1].split(' ').slice(0,4).join(' '))}…"`:proofWrong>=0?'Not yet. What must we know <b>before</b> that piece?':`Next part: <b>${PROOF[proofDone][0]}</b>.`}</div>
 <div class="controls" style="margin-top:8px"><button class="small-btn warning" data-act="proof-hint" ${proofDone===6?'disabled':''}>💡 Hint</button><button class="small-btn" data-act="proof-reset">↺ Reset</button></div>`;}

/* Fractional knapsack */
const ITEMS=[{id:'A',e:'💻',w:10,v:60,c:'#45e3c2'},{id:'B',e:'📷',w:20,v:100,c:'#7eb4ff'},{id:'C',e:'🎧',w:30,v:120,c:'#b7a0ff'},{id:'D',e:'📘',w:5,v:10,c:'#ffcc77'}];
const FKR={value:['Highest value',(a,b)=>b.v-a.v],light:['Lightest first',(a,b)=>a.w-b.w],ratio:['Best value ÷ weight',(a,b)=>b.v/b.w-a.v/a.w]};
let fkRule=null,fkCap=50;
function fracKnap(cmp,cap){let room=cap,val=0;const take={};ITEMS.slice().sort(cmp).forEach(it=>{const f=Math.max(0,Math.min(1,room/it.w));take[it.id]=f;room-=f*it.w;val+=f*it.v;});return {take,val};}
function mountFk(){const el=$('#fkLab');if(!el)return;const rule=fkRule||'ratio',res=fracKnap(FKR[rule][1],fkCap),best=fracKnap(FKR.ratio[1],fkCap).val,order=ITEMS.slice().sort(FKR[rule][1]);
 el.innerHTML=`<div class="tabs"><span class="status" style="align-self:center">Rule:</span>${Object.entries(FKR).map(([k,[l]])=>`<button class="tab ${k===fkRule?'on':''}" data-act="fk" data-k="${k}">${l}</button>`).join('')}</div>
 ${!fkRule?`<div class="feedback hint" style="margin-top:12px">🤔 Predict: which rule gives the most value? Then pick a tab.</div>`:`
 <div class="range-line" style="margin-top:6px"><span>Bag capacity</span><strong>${fkCap} kg</strong></div><input type="range" id="fkRange" min="10" max="65" step="5" value="${fkCap}" aria-label="Bag capacity">
 <div class="kbar" style="margin:6px 0">${order.filter(it=>res.take[it.id]>0).map(it=>`<div style="width:${res.take[it.id]*it.w/fkCap*100}%;background:${it.c}">${it.id}${res.take[it.id]<1?' '+Math.round(res.take[it.id]*100)+'%':''}</div>`).join('')}</div>`}
 <table class="table" style="margin-top:6px"><thead><tr><th>Item</th><th>kg</th><th>$</th><th>$/kg</th><th>Taken</th></tr></thead><tbody>${order.map(it=>`<tr><td>${it.e} <b>${it.id}</b></td><td>${it.w}</td><td>${it.v}</td><td>${it.v/it.w}</td><td class="${fkRule&&res.take[it.id]>0?'good':''}">${!fkRule?'?':res.take[it.id]===1?'all':res.take[it.id]>0?+(res.take[it.id]*it.w).toFixed(1)+' kg':'—'}</td></tr>`).join('')}</tbody></table>
 ${fkRule?`<div class="feedback ${Math.abs(res.val-best)<1e-9?'ok':'no'}" style="margin-top:auto"><b>${FKR[rule][0]}</b> → <b>$${+res.val.toFixed(1)}</b>. ${Math.abs(res.val-best)<1e-9?'Maximum value ✓':`Ratio rule gets $${+best.toFixed(1)}.`}</div>`:''}`;
 $('#fkRange')?.addEventListener('input',e=>{fkCap=+e.target.value;mountFk();$('#fkRange').focus();});}

let cs=null,ca=0,ct=null;const ctext=()=>{const s=Math.floor((ca+(cs?Date.now()-cs:0))/1000);return '⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function toggleClock(){const b=$('#timerBtn');if(cs){ca+=Date.now()-cs;cs=null;clearInterval(ct);b.classList.remove('running');}else{cs=Date.now();ct=setInterval(()=>b.textContent=ctext(),1000);b.classList.add('running');}b.textContent=ctext();}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='prev')return goTo(current-1);if(a==='next')return goTo(current+1);if(a==='jump')return goTo(+b.dataset.target);
 if(a==='timer')return toggleClock();if(a==='close')return closeOverlays();if(a==='notes')return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();
 if(a==='full'){if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();return;}
 if(a==='reveal'){const n=document.getElementById(b.dataset.id);if(n)n.hidden=!n.hidden;return;}
 if(a==='g-next'||a==='g-prev'){const k=b.dataset.g,n=GUIDES[k].steps.length;gStep[k]=Math.max(1,Math.min(n,(gStep[k]||1)+(a==='g-next'?1:-1)));return mountGuides();}
 if(a==='ch-next'||a==='ch-all'){let g=0;do{const r=chAmt-chPicks.reduce((x,y)=>x+y,0);if(r<=0)break;chPicks.push(NOTES.find(x=>x<=r));}while(a==='ch-all'&&g++<600);return mountChange();}
 if(a==='ch-reset'){chPicks=[];return mountChange();}
 if(a==='rule'){ruleSel=b.dataset.k;return mountRule();}
 if(a==='sch'){const exp=STASKS[sch.i].s>=lastFin(sch.i)?'take':'skip';if(b.dataset.c!==exp)sch.fb='Check again: compare the start time with lastFinish.';else{sch.dec[sch.i]=exp;sch.checked=true;sch.fb='';}return mountSchedule();}
 if(a==='sch-next'){sch.i++;sch.checked=false;sch.fb='';return mountSchedule();}
 if(a==='sch-reset'){sch.i=0;sch.dec=[];sch.checked=false;sch.fb='';return mountSchedule();}
 if(a==='proof'){const k=+b.dataset.k;if(k===proofDone){proofDone++;proofWrong=-1;proofHint=false;}else{proofWrong=k;proofHint=false;}return mountProof();}
 if(a==='proof-hint'){proofHint=true;proofWrong=-1;return mountProof();}
 if(a==='proof-reset'){proofDone=0;proofWrong=-1;proofHint=false;return mountProof();}
 if(a==='fk'){fkRule=b.dataset.k;return mountFk();}
 if(a==='coin-sys'){coin.sys=b.dataset.k;coin.picks=[];return mountCoin();}
 if(a==='coin-next'||a==='coin-all'){const c=PRESETS[coin.sys][1];let g=0;do{const r=coin.amount-coin.picks.reduce((x,y)=>x+y,0);if(r<=0)break;coin.picks.push(c.filter(x=>x<=r).at(-1));}while(a==='coin-all'&&g++<100);return mountCoin();}
 if(a==='coin-reset'){coin.picks=[];return mountCoin();}
 if(a==='jb'){jbAns=b.dataset.k;if(jbAns===JB[jbStep].a)jbScore++;return mountJb();}
 if(a==='jb-next'){if(jbStep===JB.length-1){jbStep=0;jbScore=0;}else jbStep++;jbAns=null;return mountJb();}
});
document.addEventListener('keydown',ev=>{
 if(ev.ctrlKey&&ev.shiftKey&&ev.key.toLowerCase()==='p'){ev.preventDefault();return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();}
 if(ev.key==='Escape')return closeOverlays();const ae=document.activeElement;
 if(ae&&ae.type==='range'&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight'))return;
 if(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' '){ev.preventDefault();if(!$('.overlay.open'))goTo(current+1);return;}
 if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();if(!$('.overlay.open'))goTo(current-1);return;}
 if(ev.key.toLowerCase()==='f'){ev.preventDefault();if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();}
});
addEventListener('resize',fitDeck);document.addEventListener('fullscreenchange',fitDeck);fitDeck();render();
</script>
</body>
</html>
