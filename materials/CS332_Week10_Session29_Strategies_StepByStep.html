<body>
<div id="deck" role="application" aria-label="Session 29 step-by-step lesson: algorithm-design strategies">
 <header class="topbar"><div class="brand">CS</div><div><div class="course">CS332 · SESSION 29</div><div class="course-sub">Air University · Week 10 · Algorithm-design strategies · step-by-step lesson</div></div><div class="dots" id="dots"></div><button class="small-btn" id="timerBtn" data-act="timer" title="Start / pause the clock">⏱ 00:00</button><button class="small-btn" data-act="notes" title="Instructor notes (Ctrl+Shift+P)">☼ Notes</button><button class="small-btn" data-act="full" title="Full screen (F)">⛶</button></header>
 <main id="slide" aria-live="polite"></main>
 <footer class="footer"><div class="foot-hint">← → change slide &nbsp;·&nbsp; <b>Next step</b> buttons build each idea &nbsp;·&nbsp; Ctrl + Shift + P = tutor notes</div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="page-count" id="pageCount"></div><button class="nav-button" id="prevButton" data-act="prev">← Back</button><button class="nav-button next" id="nextButton" data-act="next">Next →</button></footer>
 <div id="notesOverlay" class="overlay" aria-hidden="true"><div class="overlay-panel"><div class="overlay-head"><h2>Instructor notes</h2><div style="margin-left:auto" class="status" id="notesPosition"></div><button class="small-btn" data-act="close">✕ Close</button></div><div id="notesContent" class="notes-content"></div></div></div>
</div>
<script>
'use strict';
const slides=[];
function add(time,title,sub,content,notes){slides.push({time,title,sub,content,notes});}

/* ---------- step-by-step guides (right panels) ---------- */
const GUIDES={
 brute:{title:'Learn brute force in 5 steps',steps:[
  ['The idea','List <b>every</b> possible answer, check each one, keep the best. Like trying every key on a key ring.'],
  ['Watch it work','Each item is either <b>in</b> or <b>out</b> of the bag: 2 × 2 × 2 × 2 = <b>16</b> bags. Click <b>Try next</b> on the left. Red = too heavy, green = fits, gold = best so far.'],
  ['The cost','n items → <b>2ⁿ</b> options. 10 items → 1,024. 30 → about 1 billion. 60 → about <b>36 years</b> at a billion checks per second.'],
  ['When to use it','✓ The input is tiny. ✓ You need a surely-correct answer to test a faster algorithm. ✗ Never for large n.'],
  ['Check yourself','How many bags are possible with <b>5</b> items? <button class="small-btn" data-act="reveal" data-id="gb5" style="padding:4px 10px;min-height:0">Answer</button> <b id="gb5" hidden class="teal-text">2⁵ = 32</b>']]},
 divide:{title:'Learn divide & conquer in 5 steps',steps:[
  ['The idea','Break the problem into <b>smaller independent</b> pieces, solve each piece, then <b>combine</b>. Like two TAs each grading half the exams, then merging the piles.'],
  ['Watch it work','Click <b>Next step</b> on the left. Steps 1–3 <b>divide</b> (8 → 4 → 2 → 1). Steps 4–6 <b>combine</b> by merging sorted pieces.'],
  ['The cost','Merge Sort: log₂ n levels × n work per level = <b>Θ(n log n)</b>. For 1,000,000 items: about 20 million steps instead of 10¹² for an n² sort.'],
  ['When to use it','✓ The pieces are <b>independent</b> (they share no work). ✗ If the same piece is solved again and again, use DP instead.'],
  ['Check yourself','Binary search looks at the middle and keeps only one half. Which strategy? <button class="small-btn" data-act="reveal" data-id="gd5" style="padding:4px 10px;min-height:0">Answer</button> <b id="gd5" hidden class="teal-text">Divide &amp; conquer (decrease &amp; conquer)</b>']]},
 greedy:{title:'Learn greedy in 5 steps',steps:[
  ['The idea','At every step take the choice that looks <b>best right now</b> and never undo it.'],
  ['Watch it work','The hiker always steps to the <b>higher neighbour</b> and stops when both neighbours are lower. Click <b>Climb</b>. Then click bar <b>11</b> and climb again.'],
  ['The good part','Very <b>fast and simple</b>: usually one pass, often O(n) or O(n log n) after sorting.'],
  ['The danger','A <b>local</b> best is not always the <b>global</b> best. Greedy is correct only when we can <b>prove</b> the choice is safe (Session 30).'],
  ['Check yourself','Coins {1, 3, 4}, make 6. Greedy takes 4 + 1 + 1. Is that the fewest coins? <button class="small-btn" data-act="reveal" data-id="gg5" style="padding:4px 10px;min-height:0">Answer</button> <b id="gg5" hidden class="pink-text">No. 3 + 3 uses only 2 coins.</b>']]},
 dp:{title:'Learn dynamic programming in 5 steps',steps:[
  ['The idea','Split into subproblems like D&amp;C, but when the <b>same subproblem comes back</b>, reuse its stored answer.'],
  ['Watch it work','F(n) = F(n−1) + F(n−2). In <b>Plain</b> mode, amber nodes are repeated work. Switch <b>Memo ON</b>: repeats become instant lookups.'],
  ['The cost','Plain recursion is exponential: F(40) needs ≈ <b>331 million</b> calls. With memo, each F(k) is solved once: <b>79</b> calls.'],
  ['Two styles','<b>Top-down</b>: recursion + a memo table (left). <b>Bottom-up</b>: fill a table from F(0) upward with a loop.'],
  ['Check yourself','Why doesn\'t a memo table help Merge Sort? <button class="small-btn" data-act="reveal" data-id="gp5" style="padding:4px 10px;min-height:0">Answer</button> <b id="gp5" hidden class="teal-text">Its halves never repeat: no overlapping subproblems.</b>']]},
 clues:{title:'Two clues, step by step',steps:[
  ['Clue 1 · Optimal substructure','The best answer is <b>built from best answers</b> to smaller pieces. The shortest route Lahore → Karachi via Multan contains the shortest route Lahore → Multan.'],
  ['Clue 2 · Overlapping subproblems','The <b>same smaller question</b> appears again and again. Computing F(5) asks for F(3) twice.'],
  ['Put them together','<b>Both clues</b> → dynamic programming.<br><b>Substructure, no overlap</b> → divide &amp; conquer.<br><b>Substructure + a provably safe choice</b> → greedy.'],
  ['Your turn','Answer the 5 clue questions on the left. Read the reason after each answer.']]}
};
const gStep={};
function guideHtml(k){const g=GUIDES[k],s=gStep[k]||1,n=g.steps.length;
 return `<div class="guide-head"><h3>${g.title}</h3><div class="pips">${g.steps.map((_,i)=>`<i class="${i<s?'on':''}"></i>`).join('')}</div></div>
 <div style="flex:1;min-height:0">${g.steps.slice(0,s).map(([t,b],i)=>`<div class="gcard ${i===s-1?'new':''} ${t.startsWith('Check')||t.startsWith('Your')?'check':''}"><span class="num">${i+1}</span><div><b class="t">${t}</b>${b}</div></div>`).join('')}</div>
 <div class="controls" style="margin-top:8px"><button class="small-btn" data-act="g-prev" data-g="${k}" ${s<=1?'disabled':''}>← Back</button>${s<n?`<button class="small-btn amber" data-act="g-next" data-g="${k}">Next step (${s+1}/${n}) →</button>`:`<button class="small-btn primary" data-act="next">✓ Done: next slide →</button>`}</div>`;}
function mountGuides(){document.querySelectorAll('[data-guide]').forEach(el=>el.innerHTML=guideHtml(el.dataset.guide));}

/* ---------- slides ---------- */
add('00–04 min','Four ways to solve a problem','Session 29 · How to use this lesson, and where we are going.',`
<div class="grid two fill">
 <div class="panel teal col" style="justify-content:center;gap:16px;background:linear-gradient(140deg,#183b4a,#151c37)">
  <span class="tag teal">Session 29 · Algorithm-design strategies</span>
  <div class="fullsize">Don't just code.<br><span class="teal-text">Pick a strategy.</span></div>
  <div class="grid three" style="margin-top:8px">
   <div class="howto"><div class="icon">📖</div><b>1 · Read</b><span class="subtle">one step at a time</span></div>
   <div class="howto"><div class="icon">🤔</div><b>2 · Predict</b><span class="subtle">before you click</span></div>
   <div class="howto"><div class="icon">👆</div><b>3 · Click</b><span class="subtle">and check yourself</span></div>
  </div>
  <div class="callout amber" style="font-size:18px">Look for the amber <b>Next step →</b> buttons. They build each idea piece by piece.</div>
 </div>
 <div class="panel col">
  <h3>Today's path (click to jump)</h3>
  <button class="jump" data-act="jump" data-target="1"><span>🔍</span>Brute force: try everything</button>
  <button class="jump" data-act="jump" data-target="2"><span>✂</span>Divide &amp; conquer: split, solve, combine</button>
  <button class="jump" data-act="jump" data-target="3"><span>⚡</span>Greedy: best move now</button>
  <button class="jump" data-act="jump" data-target="4"><span>🧠</span>Dynamic programming: remember answers</button>
  <button class="jump" data-act="jump" data-target="5"><span>🔎</span>Spot the clues: substructure &amp; overlap</button>
  <button class="jump" data-act="jump" data-target="6"><span>🎯</span>Activity: strategy-selection scenarios</button>
  <button class="jump" data-act="jump" data-target="7"><span>🧭</span>Strategy compass &amp; cheat sheet</button>
 </div>
</div>`,`Start the clock. Explain the routine: read a step, predict, click.
ASK: "What strategy did Merge Sort use in Week 06?" Let a few students guess. We'll name it properly today.`);

add('04–11 min','🔍 Strategy 1 · Brute force','Problem: pack the bag (max 50 kg) with the highest total value.',`
<div class="grid lab fill">
 <div class="panel teal col"><div id="bruteLab" class="col" style="flex:1;min-height:0"></div></div>
 <div class="panel col" data-guide="brute"></div>
</div>`,`Predict first: most students pick A+B (best value per kg). Click through 5–6 subsets, then Run all. Best = B + C = $220.
Use guide steps on the right in order. Step 3 (cost) is the key message: correct but explodes.`);

add('11–18 min','✂ Strategy 2 · Divide & conquer','Problem: sort 8 numbers with Merge Sort.',`
<div class="grid lab fill">
 <div class="panel purple col"><div id="msLab" class="col" style="flex:1;min-height:0"></div></div>
 <div class="panel col" data-guide="divide"></div>
</div>`,`Before each click ask "what will the next row look like?"

/* Brute force */
const ITEMS=[{id:'A',e:'💻',w:10,v:60},{id:'B',e:'📷',w:20,v:100},{id:'C',e:'🎧',w:30,v:120},{id:'D',e:'📘',w:5,v:10}],CAP=50;

function mountBrute(){
 const el=$('#bruteLab');if(!el)return;let best=-1,bestV=-1;for(let m=0;m<bfStep;m++){const s=sInfo(m);if(s.w<=CAP&&s.v>bestV){bestV=s.v;best=m;}}

 <p class="lead" style="font-size:21px!important;margin:12px 0 8px">🤔 Predict: which bag is best?</p>
 <div class="subset-grid">${Array.from({length:16},(_,m)=>{const s=sInfo(m),t=m<bfStep;return `<div class="sub ${t?(m===best?'best':s.w<=CAP?'fit':'heavy'):''} ${m===bfStep-1?'cur':''}">${s.its.map(x=>x.id).join('')||'∅'}<small>${t?s.w+'kg $'+s.v:'?'}</small></div>`;}).join('')}</div>
 <div class="summary-row" style="margin-top:10px"><span>Checked <b>${bfStep}/16</b></span><span>Best so far <b>${best>=0?(sInfo(best).its.map(x=>x.id).join('+')||'∅')+' = $'+bestV:'—'}</b></span></div>
 <div class="feedback ${bfStep===16?'ok':cur&&cur.w>CAP?'no':''}" style="margin-top:auto">${!bfStep?'Click <b>Try next</b> to check the first bag (the empty one).':bfStep===16?'Done! Best = <b>B + C = $220</b>. Surprised? Brute force can\'t miss it, because it checked <b>every</b> bag.':`Bag {${cur.its.map(x=>x.id).join(', ')||'empty'}}: ${cur.w} kg, $${cur.v} → ${cur.w>CAP?'<b>too heavy</b>, rejected.':'<b>fits</b>.'}`}</div>

}

/* Merge sort */
const MS=[[[38,27,43,3,9,82,10,15]],[[38,27,43,3],[9,82,10,15]],[[38,27],[43,3],[9,82],[10,15]],[[38],[27],[43],[3],[9],[82],[10],[15]],[[27,38],[3,43],[9,82],[10,15]],[[3,27,38,43],[9,10,15,82]],[[3,9,10,15,27,38,43,82]]];

let msStep=0;
function mountMs(){const el=$('#msLab');if(!el)return;
 el.innerHTML=`<div class="summary-row"><span class="tag purple">Step ${msStep} / 6</span><span>${msStep===0?'Start':msStep<=3?'✂ Dividing':'🔗 Combining'}</span></div>

 <div class="feedback ${msStep===6?'ok':''}">${MSMSG[msStep]}</div>

/* Hill climbing */
const HILL=[3,4,6,5,4,5,7,9,8,6,4,5,10,12,11,7];let hillStart=0,hillStep=0;
function hillPath(s){const p=[s];let i=s;for(;;){const L=i>0?HILL[i-1]:-1,R=i<HILL.length-1?HILL[i+1]:-1;if(Math.max(L,R)<=HILL[i])break;i=R>=L?i+1:i-1;p.push(i);}return p;}
function mountHill(){const el=$('#hillLab');if(!el)return;
 const path=hillPath(hillStart),shown=path.slice(0,hillStep+1),pos=shown.at(-1),done=hillStep>=path.length-1,peak=HILL.indexOf(Math.max(...HILL));
 const W=800,H=300,bw=W/HILL.length;let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">`;
 HILL.forEach((h,i)=>{const bh=h*19,x=i*bw+4,y=H-26-bh;svg+=`<g data-act="hill-start" data-i="${i}"><rect x="${x}" y="${y}" width="${bw-8}" height="${bh}" rx="7" fill="${i===pos?'#ffcc77':shown.includes(i)?'#2ebf9d':i===peak?'#403569':'#2a4466'}" stroke="${i===peak?'#b7a0ff':'transparent'}" stroke-width="3"/><text x="${x+(bw-8)/2}" y="${y-7}" text-anchor="middle" font-size="15" font-weight="800" fill="#dfeaf7">${h}</text><text x="${x+(bw-8)/2}" y="${H-7}" text-anchor="middle" font-size="13" fill="#8ea6c0">${i}</text></g>`;});
 svg+=`<text x="${pos*bw+bw/2}" y="${H-26-HILL[pos]*19-28}" text-anchor="middle" font-size="26">🧗</text><text x="${peak*bw+bw/2}" y="${H-26-HILL[peak]*19-32}" text-anchor="middle" font-size="16" fill="#b7a0ff" font-weight="900">★ summit</text></svg>`;
 const L=pos>0?HILL[pos-1]:null,R=pos<HILL.length-1?HILL[pos+1]:null;
 el.innerHTML=`<div class="summary-row"><span>Start: <b>bar ${hillStart}</b></span><span>Height now: <b>${HILL[pos]}</b></span><span>Neighbours: <b>${L??'–'}</b> | <b>${R??'–'}</b></span></div>
 <div style="flex:1;min-height:0;margin:6px 0">${svg}</div>
 <div class="feedback ${done?(pos===peak?'ok':'no'):''}">${done?(pos===peak?'🎉 Reached the true summit (12) from this start.':`Stuck at <b>${HILL[pos]}</b>: both neighbours are lower. That's a <b>local</b> peak, not the summit (12). Click bar <b>11</b> and try again.`):`🤔 Predict: where will the hiker stop? Then click <b>Climb</b>.`}</div>
 <div class="controls" style="margin-top:10px;justify-content:center"><button class="small-btn primary" data-act="hill-step" ${done?'disabled':''}>Climb one step →</button><button class="small-btn" data-act="hill-all" ${done?'disabled':''}>Climb to the end</button><button class="small-btn" data-act="hill-reset">↺ Reset</button><span class="status">Tip: click any bar to start there.</span></div>`;}

/* Fibonacci */
let fibMemo=false;
function fibTree(k){return {v:'F'+k,n:k,k:k>1?[fibTree(k-1),fibTree(k-2)]:[]};}
function svgGen(root,W,H){let leaf=0;const pos=new Map(),all=[];
 (function place(t,d){all.push(t);if(!t.k.length)pos.set(t,{xi:leaf++,d});else{t.k.forEach(c=>place(c,d+1));pos.set(t,{xi:(pos.get(t.k[0]).xi+pos.get(t.k.at(-1)).xi)/2,d});}})(root,0);
 const maxD=Math.max(...[...pos.values()].map(p=>p.d)),r=21,pad=r+10,top=r+8,gap=(H-top-r-8)/maxD,X=p=>pad+p.xi*(W-2*pad)/Math.max(1,leaf-1),Y=p=>top+p.d*gap;
 const C={norm:['#1e3d5c','#8fbfdd','#fff'],rep:['#5a4520','#ffcc77','#fff3d6'],cache:['#173a36','#45e3c2','#bfffee'],gone:['#121d2e','#2c3e55','#4e6680']};let e='',s='';
 all.forEach(t=>{const a=pos.get(t);t.k.forEach(c=>{const b=pos.get(c);e+=`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${c.c==='gone'?'#22324a':'#5f88a6'}" stroke-width="3"/>`;});const col=C[t.c]||C.norm;s+=`<circle cx="${X(a)}" cy="${Y(a)}" r="${r}" fill="${col[0]}" stroke="${col[1]}" stroke-width="3"/><text x="${X(a)}" y="${Y(a)+6}" text-anchor="middle" font-size="16" font-weight="900" fill="${col[2]}">${t.v}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${e}${s}</svg>`;}
function mountFib(){const el=$('#fibLab');if(!el)return;const root=fibTree(5),done=new Set(),cnt={};
 (function w(t){cnt[t.n]=(cnt[t.n]||0)+1;t.k.forEach(w);})(root);
 (function m(t,dead){if(dead){t.c='gone';t.k.forEach(c=>m(c,true));return;}if(fibMemo&&done.has(t.n)){t.c='cache';t.k.forEach(c=>m(c,true));return;}done.add(t.n);t.c=!fibMemo&&cnt[t.n]>1&&t.n>1?'rep':'norm';t.k.forEach(c=>m(c,false));})(root,false);
 el.innerHTML=`<div class="controls"><button class="tab ${fibMemo?'':'on'}" data-act="fib" data-on="0">① Plain recursion</button><button class="tab ${fibMemo?'on':''}" data-act="fib" data-on="1">② 🧠 Memo ON</button><span class="status" style="margin-left:auto">Computing F(5)</span></div>
 <div style="flex:1;min-height:0;margin:6px 0">${svgGen(root,780,300)}</div>
 <div class="feedback ${fibMemo?'ok':'no'}">${fibMemo?'<b>9 calls.</b> Teal = answer read from the memo table instantly. Grey = work that is skipped.':'<b>15 calls.</b> Amber = repeated work: F(3) is computed 2×, F(2) 3×. 🤔 How many calls will memo save?'}</div>
 <div class="codebox">F(n): <span class="k">if</span> n ≤ 1: <span class="k">return</span> n
      <span class="k">if</span> n <span class="k">in</span> memo: <span class="k">return</span> memo[n]   <span style="color:#88aac7">← the DP trick</span>
      memo[n] ← F(n−1) + F(n−2);  <span class="k">return</span> memo[n]</div>`;}

function render(){const s=slides[current];
 $('#slide').innerHTML=`<div class="kicker"><span class="dot"></span> SESSION 29 · ALGORITHM-DESIGN STRATEGIES &nbsp;·&nbsp; <span class="time">⏱ ${s.time}</span></div><h1 class="slide-title">${s.title}</h1><div class="slide-sub">${s.sub}</div><div class="slide-body">${s.content}</div>`;
 $('#dots').innerHTML=slides.map((x,i)=>`<button class="${i===current?'on':seen.has(i)?'seen':''}" data-act="jump" data-target="${i}" title="${esc(x.title)}">${i+1}</button>`).join('');
 $('#pageCount').textContent=(current+1)+' / '+slides.length;$('#progressFill').style.width=((current+1)*100/slides.length)+'%';
 $('#prevButton').disabled=current===0;$('#nextButton').disabled=current===slides.length-1;mountAll();}
let cs=null,ca=0,ct=null;const ctext=()=>{const s=Math.floor((ca+(cs?Date.now()-cs:0))/1000);return '⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function toggleClock(){const b=$('#timerBtn');if(cs){ca+=Date.now()-cs;cs=null;clearInterval(ct);b.classList.remove('running');}else{cs=Date.now();ct=setInterval(()=>b.textContent=ctext(),1000);b.classList.add('running');}b.textContent=ctext();}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='prev')return goTo(current-1);if(a==='next')return goTo(current+1);if(a==='jump')return goTo(+b.dataset.target);
 if(a==='timer')return toggleClock();if(a==='close')return closeOverlays();if(a==='notes')return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();
 if(a==='full'){if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();return;}
 if(a==='reveal'){const n=document.getElementById(b.dataset.id);if(n)n.hidden=!n.hidden;return;}
 if(a==='g-next'||a==='g-prev'){const k=b.dataset.g,n=GUIDES[k].steps.length;gStep[k]=Math.max(1,Math.min(n,(gStep[k]||1)+(a==='g-next'?1:-1)));return mountGuides();}
 if(a==='bf-next'){bfStep=Math.min(16,bfStep+1);return mountBrute();}if(a==='bf-all'){bfStep=16;return mountBrute();}if(a==='bf-reset'){bfStep=0;return mountBrute();}
 if(a.startsWith('ms-')){msStep=a==='ms-reset'?0:Math.max(0,Math.min(6,msStep+(a==='ms-next'?1:-1)));return mountMs();}
 if(a==='hill-start'){hillStart=+b.dataset.i;hillStep=0;return mountHill();}if(a==='hill-step'){hillStep++;return mountHill();}
 if(a==='hill-all'){hillStep=hillPath(hillStart).length-1;return mountHill();}if(a==='hill-reset'){hillStep=0;return mountHill();}
 if(a==='fib'){fibMemo=b.dataset.on==='1';return mountFib();}
 if(a==='clue'){clueAns=b.dataset.k;if(clueAns===CLUES[clueStep].a)clueScore++;return mountClue();}
 if(a==='clue-next'){if(clueStep===CLUES.length-1){clueStep=0;clueScore=0;}else clueStep++;clueAns=null;return mountClue();}
 if(a==='sc-hint'){scHint=true;return mountScen();}
 if(a==='sc'){scAns=b.dataset.k;scDone++;if(scAns===SCEN[scStep].a)scScore++;return mountScen();}
 if(a==='sc-next'){if(scStep===SCEN.length-1){scStep=0;scScore=0;scDone=0;}else scStep++;scAns=null;scHint=false;return mountScen();}
 if(a==='cp'){cPath.push(b.dataset.a);return mountCompass();}if(a==='cp-back'){cPath.pop();return mountCompass();}if(a==='cp-reset'){cPath=[];return mountCompass();}
});
document.addEventListener('keydown',ev=>{
 if(ev.ctrlKey&&ev.shiftKey&&ev.key.toLowerCase()==='p'){ev.preventDefault();return $('#notesOverlay').classList.contains('open')?closeOverlays():openNotes();}
 if(ev.key==='Escape')return closeOverlays();if(document.activeElement?.tagName==='SELECT')return;
 if(ev.key==='ArrowRight'||ev.key==='PageDown'||ev.key===' '){ev.preventDefault();if(!$('.overlay.open'))goTo(current+1);return;}
 if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();if(!$('.overlay.open'))goTo(current-1);return;}
 if(ev.key.toLowerCase()==='f'){ev.preventDefault();if(!document.fullscreenElement)$('#deck').requestFullscreen?.().then(fitDeck).catch(()=>{});else document.exitFullscreen?.();}
});
addEventListener('resize',fitDeck);document.addEventListener('fullscreenchange',fitDeck);fitDeck();render();
</script>
</body>
</html>
